# 在 CI 的 Mac 上按裝置端的真實模塊集與參數復現 PaxIDX 的 Swift 編譯，
# 找出到底是哪個模塊在被「從接口現場建」時撞上 SILGen 崩潰。
#
# 背景（2026-10-26）：裝置端編 print("Hello") 必崩，符号化定案崩在子編譯
# 實例從 .swiftinterface 現場建模塊的 SILGen。_Concurrency 補上自編 ios15
# 二進制後真機仍同點崩（pid 626/631）——兇手另有其模塊。
# 首輪復現（run #2）實證：主機前端用裝置參數編同一句代碼，模塊緩存裡冒出
# _Concurrency／_StringProcessing／SwiftOnoneSupport 三個現場建產物——
# 前兩個明明有二進制在 SDK 裡。Swift 本人沒被重建。本輪三個對照實驗：
# E1 基線（合法 library 源文件、裝置參數、乾淨緩存）；
# E2 把 _Concurrency／SwiftOnoneSupport 目錄裡的 .swiftinterface 刪光
#    （只剩二進制）再編，看還重不重建；
# E5 整個拿掉 _StringProcessing.swiftmodule 再編，看另外兩個還重不重建
#    （驗「某個模塊觸發整圖 explicit build」假說）。
name: diagnose-device-compile

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN_TAG: toolchain-33957bbc59f4-swift-swift-6.2.4-RELEASE-ios15.0-sdk18.5
  SDK_TAG: darwin-sdk-1

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Restore the host Swift 6.2.4 toolchain
        id: host-swift-cache
        uses: actions/cache/restore@v4
        with:
          path: host-swift-toolchain
          key: host-swift-6.2.4-osx-toolchain-v1

      - name: Locate the host frontend
        shell: bash
        run: |
          set -euxo pipefail
          SWIFTC_PATH="$(find "$PWD/host-swift-toolchain" -path '*usr/bin/swiftc' -print -quit)"
          test -n "$SWIFTC_PATH"
          TC_USR="$(dirname "$(dirname "$SWIFTC_PATH")")"
          test -x "$TC_USR/bin/swift-frontend"
          echo "HOST_FRONTEND=$TC_USR/bin/swift-frontend" >> "$GITHUB_ENV"

      - name: Assemble the device-equivalent SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p dl
          gh release download "$SDK_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'paxidx-darwin-sdk.zip' --dir dl
          gh release download "$TOOLCHAIN_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'swift-toolchain-modules.zip' --pattern 'clang-resource-headers.zip' --dir dl
          mkdir -p sdkroot
          unzip -q dl/paxidx-darwin-sdk.zip -d sdkroot
          SDKROOT="$PWD/sdkroot/iPhoneOS-fixed.sdk"
          test -d "$SDKROOT"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          # Clang 頭文件：照 App 的裝法（清空 usr/lib/clang、內容裝到 19.1.5）
          mkdir -p /tmp/clang-h && unzip -q dl/clang-resource-headers.zip -d /tmp/clang-h
          rm -rf "$SDKROOT/usr/lib/clang"
          mkdir -p "$SDKROOT/usr/lib/clang/19.1.5"
          cp -R /tmp/clang-h/clang-headers/19/. "$SDKROOT/usr/lib/clang/19.1.5/"
          test -f "$SDKROOT/usr/lib/clang/19.1.5/include/stdarg.h"
          # 模塊疊加：照 App 的 overlayCopy（swift-stdlib-ios 內容合併進 usr/lib/swift）
          mkdir -p /tmp/mods && unzip -q dl/swift-toolchain-modules.zip -d /tmp/mods
          cp -R /tmp/mods/swift-stdlib-ios/. "$SDKROOT/usr/lib/swift/"
          echo "=== E0 merged module dirs (post-overlay):"
          for m in Swift SwiftOnoneSupport _Concurrency _StringProcessing; do
            echo "--- $m.swiftmodule:"
            ls "$SDKROOT/usr/lib/swift/$m.swiftmodule/" || true
          done

      - name: E6 - reproduce the post-fix device state with full output
        shell: bash
        run: |
          set -uxo pipefail
          # 裝置修復後狀態（App #57 疊加的產物）：三個帶二進制的模塊目錄裡
          # 接口全清（整個目錄替換），_StringProcessing 仍是 SDK 的 6.1.2 接口。
          # App 側的替換對 Swift 目錄同樣生效，這裡三個目錄一併清。
          for m in Swift SwiftOnoneSupport _Concurrency; do
            rm -f "$SDKROOT/usr/lib/swift/$m.swiftmodule/"*.swiftinterface \
                  "$SDKROOT/usr/lib/swift/$m.swiftmodule/"*.private.swiftinterface
            echo "--- $m dir now:"; ls "$SDKROOT/usr/lib/swift/$m.swiftmodule/"
          done
          # 與裝置完全同名的輸入輸出（模塊名自然推導為 newfile，避免人造錯誤）
          mkdir -p /tmp/e6
          printf 'print("Hello")\n' > /tmp/e6/newfile.swift
          rm -rf /tmp/cache-e6 && mkdir -p /tmp/cache-e6
          FE=0
          "$HOST_FRONTEND" -frontend -c /tmp/e6/newfile.swift \
            -module-cache-path /tmp/cache-e6 \
            -Xcc -fmodules-cache-path=/tmp/cache-e6 \
            -target arm64-apple-ios15.0 \
            -sdk "$SDKROOT" \
            -resource-dir "$SDKROOT/usr/lib/swift" \
            -Xcc -resource-dir -Xcc "$SDKROOT/usr/lib/clang/19.1.5" \
            -enable-objc-interop -parse-as-library -emit-object \
            -o /tmp/e6/newfile.o > /tmp/out-e6.txt 2>&1 || FE=$?
          echo "=== E6 exit=$FE"
          echo "--- E6 full frontend output:"
          cat /tmp/out-e6.txt
          echo "--- E6 swift modules built into cache:"
          ls /tmp/cache-e6 | grep '\.swiftmodule$' || echo "(none)"
          ls -la /tmp/e6/newfile.o || echo "--- E6 NO object"

      - name: E7 - inspect object autolink options and trial-link with the proper recipe
        shell: bash
        run: |
          set -uxo pipefail
          echo "=== E7a linker options recorded in newfile.o (autolink):"
          otool -l /tmp/e6/newfile.o | grep -A6 'LC_LINKER_OPTION' || echo "(no LC_LINKER_OPTION found by grep)"
          echo "--- E7a raw strings around swift lib names in newfile.o:"
          strings /tmp/e6/newfile.o | grep -E '^-l|swift' | sort -u | head -40
          mkdir -p /tmp/e7/tbd
          cat > /tmp/e7/tbd/libswiftCompatibility56.tbd <<'TBD'
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-ios ]
          install-name:    '/usr/lib/swift/libswiftCompatibility56.dylib'
          exports:
            - targets:         [ arm64-ios ]
              symbols:         [ __swift_FORCE_LOAD_$_swiftCompatibility56 ]
          TBD
          printf 'int main(void){return 0;}\n' > /tmp/e7/main.c
          clang -target arm64-apple-ios15.0 -isysroot "$SDKROOT" -c /tmp/e7/main.c -o /tmp/e7/main.o || echo "E7 main.o compile failed"
          echo "=== E7b V1: full recipe (-lSystem -lswiftCore + weak compat56 via synthesized tbd)"
          ld -o /tmp/e7/TestV1 /tmp/e6/newfile.o /tmp/e7/main.o \
            -arch arm64 -platform_version ios 15.0 18.5 \
            -syslibroot "$SDKROOT" -L"$SDKROOT/usr/lib/swift" -L/tmp/e7/tbd \
            -lSystem -lswiftCore -weak-lswiftCompatibility56 > /tmp/out-v1.txt 2>&1
          echo "V1 exit=$?"; cat /tmp/out-v1.txt
          echo "--- V1 load commands:"; otool -L /tmp/e7/TestV1 || echo "(no V1 output)"
          echo "--- V1 still-undefined:"; nm -u /tmp/e7/TestV1 2>/dev/null || true
          echo "=== E7c V2: no compat56 handling at all (see what the link demands)"
          ld -o /tmp/e7/TestV2 /tmp/e6/newfile.o /tmp/e7/main.o \
            -arch arm64 -platform_version ios 15.0 18.5 \
            -syslibroot "$SDKROOT" -L"$SDKROOT/usr/lib/swift" \
            -lSystem -lswiftCore > /tmp/out-v2.txt 2>&1
          echo "V2 exit=$?"; cat /tmp/out-v2.txt
          echo "--- V2 load commands:"; otool -L /tmp/e7/TestV2 || echo "(no V2 output)"
