name: Build LLVM (Nyxian recipe, iOS 15, Swift 6.4)

# 構建腳本已 vendored 進本專案 Tools/LLVM-On-iOS/（來源 emexlab/LLVM-On-iOS
# 釘定版 5c2e215a，MIT，LICENSE 隨附），preset 部署目標已改 15.0。
# 產物：LLVM.xcframework（minos 15.0 原生）＋CoreCompilerSupportLibs＋SwiftToolchain.zip。

on:
  workflow_dispatch:

jobs:
  build-llvm:
    runs-on: macos-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: Tools/LLVM-On-iOS
    steps:
      - uses: actions/checkout@v4
      - name: Show vendored preset deployment target
        run: |
          grep darwin-deployment-version-ios Scripts/swift-ios-toolchain-presets.ini
      - name: Build (vendored Makefile)
        env:
          IOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          make all OS_VER=15.0 SWIFT_BRANCH=swift-6.4.0-RELEASE
      - name: Verify minos of produced dylibs
        if: always()
        run: |
          ls -la LLVM.xcframework CoreCompilerSupportLibs 2>/dev/null | head -30
          for f in CoreCompilerSupportLibs/*.dylib; do
            [ -f "$f" ] || continue
            echo "== $f"
            vtool -show-build "$f" 2>/dev/null | grep -E 'platform|minos|sdk' || otool -l "$f" | grep -A3 LC_BUILD_VERSION | head -6
          done
      - name: Archive outputs
        if: always()
        run: |
          [ -d LLVM.xcframework ] && tar -cJf LLVM.xcframework.tar.xz LLVM.xcframework || echo "no LLVM.xcframework"
          [ -d CoreCompilerSupportLibs ] && tar -cJf CoreCompilerSupportLibs.tar.xz CoreCompilerSupportLibs || echo "no CoreCompilerSupportLibs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LLVM-xcframework-ios15
          path: |
            Tools/LLVM-On-iOS/LLVM.xcframework.tar.xz
            Tools/LLVM-On-iOS/CoreCompilerSupportLibs.tar.xz
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwiftToolchain-iphoneos-ios15
          path: Tools/LLVM-On-iOS/SwiftToolchain.zip
          if-no-files-found: warn
