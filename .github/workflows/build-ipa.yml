# 在 GitHub Actions 上編譯 PaxIDX 並打出未簽名 IPA
# 所有註釋使用正體中文
name: Build PaxIDX IPA

on:
  workflow_dispatch:
    inputs:
      nyx_test:
        description: '實驗包：內嵌改戳記（minos 15.0）版 Nyxian CoreCompiler'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - 'Support/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 選擇兼容的 Xcode
        run: |
          ls /Applications/ | grep Xcode
          # 嘗試找個舊版 Xcode，找不到就用默認的
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            echo "沒有舊版 Xcode，用默認的"
          fi
          xcodebuild -version

      - name: 下載原生工具鏈 dylib（C 版，LLD iOS 已修復）
        run: |
          mkdir -p Vendor/NativeToolchain
          # C 版（Swift LLVM fork，LLD iOS 封鎖已移除）：
          # 專注 C 編譯，Swift 已暫停
          curl -sSL -o /tmp/toolchain-dylib.zip "https://github.com/yongshuai1013/PaxIDX/releases/download/toolchain-33957bbc59f4-swift-swift-6.2.4-RELEASE-ios15.0-sdk18.5/libPaxIDXNativeToolchain.dylib.zip"
          unzip -o /tmp/toolchain-dylib.zip -d Vendor/NativeToolchain
          ls -la Vendor/NativeToolchain/

      - name: 生成 Xcode 項目
        run: xcodegen generate

      - name: 編譯並打包（不簽名）
        run: |
          xcodebuild archive \
            -scheme PaxIDX \
            -destination 'generic/platform=iOS' \
            -archivePath build/PaxIDX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -R build/PaxIDX.xcarchive/Products/Applications/PaxIDX.app build/ipa/Payload/
          # dylib 塞進 Frameworks，跟 App 一起簽名（iOS 才允許 dlopen）
          mkdir -p build/ipa/Payload/PaxIDX.app/Frameworks
          cp Vendor/NativeToolchain/libPaxIDXNativeToolchain.dylib build/ipa/Payload/PaxIDX.app/Frameworks/
          if [ "${{ inputs.nyx_test }}" = "true" ]; then
            echo "nyx_test：下載 Nyxian 0.11.4、改戳記 CoreCompiler 後內嵌"
            curl -sSL -o /tmp/nyxian.ipa "https://github.com/emexlab/Nyxian/releases/download/0.11.4/Nyxian.ipa"
            mkdir -p /tmp/nyx && unzip -o -q /tmp/nyxian.ipa "Payload/Nyxian.app/Frameworks/CoreCompiler.framework/*" -d /tmp/nyx
            FWDIR=/tmp/nyx/Payload/Nyxian.app/Frameworks/CoreCompiler.framework python3 - <<'PYEOF'
          import os, struct, glob
          fw = os.environ['FWDIR']
          targets = [os.path.join(fw, 'CoreCompiler')] + sorted(glob.glob(fw + '/Frameworks/*.dylib'))
          want = 15 << 16
          for path in targets:
              d = bytearray(open(path, 'rb').read())
              n = struct.unpack_from('<I', d, 16)[0]
              p = 32; hit = 0
              for _ in range(n):
                  cmd, size = struct.unpack_from('<II', d, p)
                  if cmd == 0x32:
                      struct.pack_into('<I', d, p + 12, want); hit += 1
                  p += size
              assert hit == 1, (path, hit)
              open(path, 'wb').write(d)
              print('patched minos->15.0:', os.path.basename(path))
          PYEOF
            cp -R /tmp/nyx/Payload/Nyxian.app/Frameworks/CoreCompiler.framework build/ipa/Payload/PaxIDX.app/Frameworks/
            echo "nyx_test：組 PaxSDK.zip（完整原始 SDK＋BSROOT res，他們的打包法；S10 用）"
            unzip -o -q /tmp/nyxian.ipa "Payload/Nyxian.app/Shared/swift.zip" -d /tmp/nyx
            unzip -o -q /tmp/nyx/Payload/Nyxian.app/Shared/swift.zip "swift/shims/*" "swift/clang/*" "swift/module.modulemap" -d /tmp/nyxres
            # SDK 換 Xcode 26 原生 iphoneos SDK（CI 機 Xcode 26.6 的 26.5 世代，
            # 與自編 6.4 前端同世代）；部署目標 15 由探針 -target 指定。
            SDKROOT2=$(xcrun --sdk iphoneos --show-sdk-path)
            echo "Xcode SDK 來源：$SDKROOT2"
            ls "$SDKROOT2" | head -5
            rm -rf /tmp/paxsdk && mkdir -p /tmp/paxsdk/res
            mkdir -p /tmp/paxsdk/iPhoneOS.sdk
            cp -R "$SDKROOT2/." /tmp/paxsdk/iPhoneOS.sdk/
            cp -R /tmp/nyxres/swift/shims /tmp/nyxres/swift/clang /tmp/nyxres/swift/module.modulemap /tmp/paxsdk/res/
            APPZIP="$PWD/build/ipa/Payload/PaxIDX.app/PaxSDK.zip"
            (cd /tmp/paxsdk && zip -r -q "$APPZIP" iPhoneOS.sdk res)
            ls -la build/ipa/Payload/PaxIDX.app/PaxSDK.zip
          fi
          cd build/ipa && zip -r ../PaxIDX-unsigned.ipa Payload

      - name: 上傳未簽名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaxIDX-unsigned-ipa
          path: build/PaxIDX-unsigned.ipa
