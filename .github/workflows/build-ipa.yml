# 在 GitHub Actions 上編譯 PaxIDX 並打出未簽名 IPA
# 所有註釋使用正體中文
name: Build PaxIDX IPA

on:
  workflow_dispatch:
    inputs:
      nyx_test:
        description: '實驗包：內嵌改戳記（minos 15.0）版 Nyxian CoreCompiler'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - 'Support/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 選擇兼容的 Xcode
        run: |
          ls /Applications/ | grep Xcode
          # 嘗試找個舊版 Xcode，找不到就用默認的
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            echo "沒有舊版 Xcode，用默認的"
          fi
          xcodebuild -version

      - name: 下載原生工具鏈 dylib（C 版，LLD iOS 已修復）
        run: |
          mkdir -p Vendor/NativeToolchain
          # C 版（Swift LLVM fork，LLD iOS 封鎖已移除）：
          # 專注 C 編譯，Swift 已暫停
          curl -sSL -o /tmp/toolchain-dylib.zip "https://github.com/yongshuai1013/PaxIDX/releases/download/toolchain-33957bbc59f4-swift-swift-6.2.4-RELEASE-ios15.0-sdk18.5/libPaxIDXNativeToolchain.dylib.zip"
          unzip -o /tmp/toolchain-dylib.zip -d Vendor/NativeToolchain
          ls -la Vendor/NativeToolchain/

      - name: 生成 Xcode 項目
        run: xcodegen generate

      - name: 編譯並打包（不簽名）
        run: |
          xcodebuild archive \
            -scheme PaxIDX \
            -destination 'generic/platform=iOS' \
            -archivePath build/PaxIDX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -R build/PaxIDX.xcarchive/Products/Applications/PaxIDX.app build/ipa/Payload/
          # dylib 塞進 Frameworks，跟 App 一起簽名（iOS 才允許 dlopen）
          mkdir -p build/ipa/Payload/PaxIDX.app/Frameworks
          cp Vendor/NativeToolchain/libPaxIDXNativeToolchain.dylib build/ipa/Payload/PaxIDX.app/Frameworks/
          if [ "${{ inputs.nyx_test }}" = "true" ]; then
            echo "nyx_test：下載 Nyxian 0.11.4、改戳記 CoreCompiler 後內嵌"
            curl -sSL -o /tmp/nyxian.ipa "https://github.com/emexlab/Nyxian/releases/download/0.11.4/Nyxian.ipa"
            mkdir -p /tmp/nyx && unzip -o -q /tmp/nyxian.ipa "Payload/Nyxian.app/Frameworks/CoreCompiler.framework/*" -d /tmp/nyx
            FWDIR=/tmp/nyx/Payload/Nyxian.app/Frameworks/CoreCompiler.framework python3 - <<'PYEOF'
          import os, struct, glob
          fw = os.environ['FWDIR']
          targets = [os.path.join(fw, 'CoreCompiler')] + sorted(glob.glob(fw + '/Frameworks/*.dylib'))
          want = 15 << 16
          for path in targets:
              d = bytearray(open(path, 'rb').read())
              n = struct.unpack_from('<I', d, 16)[0]
              p = 32; hit = 0
              for _ in range(n):
                  cmd, size = struct.unpack_from('<II', d, p)
                  if cmd == 0x32:
                      struct.pack_into('<I', d, p + 12, want); hit += 1
                  p += size
              assert hit == 1, (path, hit)
              open(path, 'wb').write(d)
              print('patched minos->15.0:', os.path.basename(path))
          PYEOF
            cp -R /tmp/nyx/Payload/Nyxian.app/Frameworks/CoreCompiler.framework build/ipa/Payload/PaxIDX.app/Frameworks/
            echo "nyx_test：抽 Nyxian BSROOT 的 shims＋clang＋頂層表組 NyxRes（S9 resource-dir 用）"
            unzip -o -q /tmp/nyxian.ipa "Payload/Nyxian.app/Shared/swift.zip" -d /tmp/nyx
            unzip -o -q /tmp/nyx/Payload/Nyxian.app/Shared/swift.zip "swift/shims/*" "swift/clang/*" "swift/module.modulemap" -d /tmp/nyxres
            mkdir -p build/ipa/Payload/PaxIDX.app/NyxRes
            cp -R /tmp/nyxres/swift/shims /tmp/nyxres/swift/clang /tmp/nyxres/swift/module.modulemap build/ipa/Payload/PaxIDX.app/NyxRes/
            ls build/ipa/Payload/PaxIDX.app/NyxRes
            ls -la build/ipa/Payload/PaxIDX.app/Frameworks/
            echo "nyx_test：內嵌原始 SDK 的 usr/lib/swift 介面集（S 段影子 SDK 用）"
            curl -sSL -o /tmp/darwin-sdk.zip "https://github.com/yongshuai1013/PaxIDX/releases/download/darwin-sdk-1/paxidx-darwin-sdk.zip"
            mkdir -p /tmp/sdkx build/ipa/Payload/PaxIDX.app/NyxInterfaces
            unzip -l /tmp/darwin-sdk.zip | head -5
            unzip -o -q /tmp/darwin-sdk.zip "*/usr/lib/swift/*" -d /tmp/sdkx
            SWIFTDIR=$(find /tmp/sdkx -type d -path "*/usr/lib/swift" | head -1)
            echo "介面集來源：$SWIFTDIR"
            cp -R "$SWIFTDIR/." build/ipa/Payload/PaxIDX.app/NyxInterfaces/
            # 這支 .a 開頭是 FAT Mach-O 魔數，TrollStore 安裝時 ldid 全包掃簽會
            # 卡死在它身上（錯誤 175）；與探針無關，剔除
            rm -f build/ipa/Payload/PaxIDX.app/NyxInterfaces/libswiftAuthenticationServicesSwiftSDKOverlay.a
            # S8：原始 SDK 的框架 Modules 一併內嵌（只有 .swiftinterface；
            # 裝置 SDK 那份同樣被 6.2.4 二進制疊加，S7 在 Foundation 段實證）
            unzip -o -q /tmp/darwin-sdk.zip "*/System/Library/Frameworks/*" -d /tmp/sdkfw
            FWROOT=$(find /tmp/sdkfw -type d -path "*/System/Library/Frameworks" | head -1)
            echo "框架 Modules 來源：$FWROOT"
            mkdir -p build/ipa/Payload/PaxIDX.app/NyxFwModules
            for fw in "$FWROOT"/*.framework; do
              name=$(basename "$fw")
              if [ -d "$fw/Modules" ]; then
                mkdir -p "build/ipa/Payload/PaxIDX.app/NyxFwModules/$name"
                cp -R "$fw/Modules" "build/ipa/Payload/PaxIDX.app/NyxFwModules/$name/Modules"
              fi
            done
            echo "NyxFwModules 框架數：$(ls build/ipa/Payload/PaxIDX.app/NyxFwModules | wc -l)"
            ls build/ipa/Payload/PaxIDX.app/NyxInterfaces/ | head -5
          fi
          cd build/ipa && zip -r ../PaxIDX-unsigned.ipa Payload

      - name: 上傳未簽名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaxIDX-unsigned-ipa
          path: build/PaxIDX-unsigned.ipa
