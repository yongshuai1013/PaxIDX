# 在 GitHub Actions 上編譯 PaxIDX 並打出未簽名 IPA
# 所有註釋使用正體中文
name: Build PaxIDX IPA

on:
  workflow_dispatch:
    inputs:
      nyx_test:
        description: '實驗包：內嵌改戳記（minos 15.0）版 Nyxian CoreCompiler'
        type: boolean
        default: false
      sdk27:
        description: 'SDK 換 27.1：抓 owngoal-dev/iOS-SDKs 分支 sdk/iPhoneOS27.1（Xcode 27.1 原版）打包'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - 'Support/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 選擇兼容的 Xcode
        run: |
          ls /Applications/ | grep Xcode
          # 嘗試找個舊版 Xcode，找不到就用默認的
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            echo "沒有舊版 Xcode，用默認的"
          fi
          xcodebuild -version

      - name: 下載原生工具鏈 dylib（C 版，LLD iOS 已修復）
        run: |
          mkdir -p Vendor/NativeToolchain
          # C 版（Swift LLVM fork，LLD iOS 封鎖已移除）：
          # 專注 C 編譯，Swift 已暫停
          curl -sSL -o /tmp/toolchain-dylib.zip "https://github.com/yongshuai1013/PaxIDX/releases/download/toolchain-33957bbc59f4-swift-swift-6.2.4-RELEASE-ios15.0-sdk18.5/libPaxIDXNativeToolchain.dylib.zip"
          unzip -o /tmp/toolchain-dylib.zip -d Vendor/NativeToolchain
          ls -la Vendor/NativeToolchain/

      - name: 生成 Xcode 項目
        run: xcodegen generate

      - name: 編譯並打包（不簽名）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xcodebuild archive \
            -scheme PaxIDX \
            -destination 'generic/platform=iOS' \
            -archivePath build/PaxIDX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -R build/PaxIDX.xcarchive/Products/Applications/PaxIDX.app build/ipa/Payload/
          # dylib 塞進 Frameworks，跟 App 一起簽名（iOS 才允許 dlopen）
          mkdir -p build/ipa/Payload/PaxIDX.app/Frameworks
          cp Vendor/NativeToolchain/libPaxIDXNativeToolchain.dylib build/ipa/Payload/PaxIDX.app/Frameworks/
            echo "整合正式路：內嵌自編 CoreCompiler（release corecompiler-6.4-ios15，minos 15 原生）"
            gh release download corecompiler-6.4-ios15 --repo yongshuai1013/PaxIDX --pattern "CoreCompiler.framework.zip" --dir /tmp/ccfw
            unzip -o -q /tmp/ccfw/CoreCompiler.framework.zip -d /tmp/ccfw/x
            ls -la /tmp/ccfw/x/CoreCompiler.framework/
            cp -R /tmp/ccfw/x/CoreCompiler.framework build/ipa/Payload/PaxIDX.app/Frameworks/
            echo "組 PaxSDK.zip（完整 SDK＋自編 res）"
            # SDK 換 Xcode 26 原生 iphoneos SDK（CI 機 Xcode 26.6 的 26.5 世代，
            # 與自編 6.4 前端同世代）；部署目標 15 由探針 -target 指定。
            if [ "${{ inputs.sdk27 }}" = "true" ]; then
              echo "SDK 來源：owngoal-dev/iOS-SDKs 分支 sdk/iPhoneOS27.1（Xcode 27.1 原版、未改）"
              curl -sSL -o /tmp/sdk27.tar.gz "https://codeload.github.com/owngoal-dev/iOS-SDKs/tar.gz/refs/heads/sdk/iPhoneOS27.1"
              mkdir -p /tmp/sdk27 && tar -xzf /tmp/sdk27.tar.gz -C /tmp/sdk27 --strip-components=1
              SDKROOT2=$(find /tmp/sdk27 -maxdepth 2 -name 'iPhoneOS*.sdk' -type d | head -1)
              RELTAG=paxsdk-ios27
            else
              SDKROOT2=$(xcrun --sdk iphoneos --show-sdk-path)
              RELTAG=paxsdk-ios26
            fi
            echo "Xcode SDK 來源：$SDKROOT2"
            ls "$SDKROOT2" | head -5
            rm -rf /tmp/paxsdk && mkdir -p /tmp/paxsdk/res
            mkdir -p /tmp/paxsdk/iPhoneOS.sdk
            cp -R "$SDKROOT2/." /tmp/paxsdk/iPhoneOS.sdk/
            echo "改寫 SDK 介面版本戳：Xcode 26 SDK 介面由 Apple Swift 6.3.2 產出、OSS 6.4 前端會以「SDK 不受支援」拒收；戳改成自編前端版本（介面格式同為 1.0）"
            find /tmp/paxsdk/iPhoneOS.sdk -name '*.swiftinterface' -type f | while read -r f; do
              sed -i '' -E 's|^// swift-compiler-version: .*|// swift-compiler-version: Apple Swift version 6.4 (swift-6.4-RELEASE)|; s|-interface-compiler-version [0-9]+\.[0-9]+(\.[0-9]+)*|-interface-compiler-version 6.4|g' "$f"
            done
            grep -m1 'swift-compiler-version' /tmp/paxsdk/iPhoneOS.sdk/usr/lib/swift/Swift.swiftmodule/arm64e-apple-ios.swiftinterface || true
            gh release download corecompiler-6.4-ios15 --repo yongshuai1013/PaxIDX --pattern "res.zip" --dir /tmp/ccres
            unzip -o -q /tmp/ccres/res.zip -d /tmp/paxsdk/res
            ls /tmp/paxsdk/res
            APPZIP="$PWD/build/ipa/Payload/PaxIDX.app/PaxSDK.zip"
            (cd /tmp/paxsdk && zip -r -q "$APPZIP" iPhoneOS.sdk res)
            echo "同版 PaxSDK.zip 發布到 release $RELTAG（App 設定頁「下載 SDK」取用）"
            gh release view "$RELTAG" --repo yongshuai1013/PaxIDX >/dev/null 2>&1 || gh release create "$RELTAG" --repo yongshuai1013/PaxIDX --title "PaxSDK ($RELTAG)" --notes "PaxIDX 編譯用 SDK，打包 workflow 自動更新；App 設定頁「下載 SDK」取用。"
            gh release upload "$RELTAG" "$APPZIP" --repo yongshuai1013/PaxIDX --clobber
            ls -la build/ipa/Payload/PaxIDX.app/PaxSDK.zip
          brew install ldid 2>/dev/null || true
          ldid -Sci-entitlements.plist build/ipa/Payload/PaxIDX.app/PaxIDX
          echo "main executable entitlements after ldid:"
          ldid -e build/ipa/Payload/PaxIDX.app/PaxIDX | grep -a "can-load-cdhash"
          printf 'int paxidx_g_answer(void){return 42;}\n' > /tmp/probe_g.c
          xcrun clang -target arm64-apple-ios15.0 -dynamiclib -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" /tmp/probe_g.c -o build/ipa/Payload/PaxIDX.app/probe_ldid.dylib
          ldid -S build/ipa/Payload/PaxIDX.app/probe_ldid.dylib
          SYNTAX_SRC=$(find build/ipa/Payload/PaxIDX.app -name "lib_CompilerSwiftSyntax.dylib" | head -1)
          echo "G4 syntax src: $SYNTAX_SRC"
          cp "$SYNTAX_SRC" build/ipa/Payload/PaxIDX.app/syntax_codesign.dylib
          codesign -s - --force build/ipa/Payload/PaxIDX.app/syntax_codesign.dylib
          ls -la build/ipa/Payload/PaxIDX.app/probe_ldid.dylib build/ipa/Payload/PaxIDX.app/syntax_codesign.dylib
          cd build/ipa && zip -r ../PaxIDX-unsigned.ipa Payload

      - name: 上傳未簽名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaxIDX-unsigned-ipa
          path: build/PaxIDX-unsigned.ipa
